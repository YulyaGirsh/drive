<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест подписки в Telegram</title>
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .test-section {
            margin: 15px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .success { background: rgba(40, 167, 69, 0.3); border: 1px solid #28a745; }
        .error { background: rgba(220, 53, 69, 0.3); border: 1px solid #dc3545; }
        .info { background: rgba(23, 162, 184, 0.3); border: 1px solid #17a2b8; }
        button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        button:hover { 
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .video-link {
            display: block;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .video-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Тест подписки в Telegram</h1>
        
        <div class="test-section">
            <h3>👤 Информация о пользователе</h3>
            <div id="userInfo" class="result info">Загрузка...</div>
        </div>
        
        <div class="test-section">
            <h3>🔐 Проверка подписки</h3>
            <button onclick="checkSubscription()">Проверить подписку</button>
            <div id="subscriptionResult" class="result info">Нажмите кнопку для проверки</div>
        </div>
        
        <div class="test-section">
            <h3>🎥 Тест видеоуроков</h3>
            <a href="videos.html" class="video-link">📺 Открыть видеоуроки</a>
            <a href="parking.html" class="video-link">🚗 Открыть курс парковки</a>
        </div>
        
        <div class="test-section">
            <h3>📊 Логи</h3>
            <div id="logs" style="background: rgba(0, 0, 0, 0.2); padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram?.WebApp;
        const CHANNEL_USERNAME = 'avtoshkolavtelefone';
        
        function log(message) {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            logsDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            log('Страница загружена в Telegram Mini App');
            
            // Инициализируем Telegram WebApp
            if (tg) {
                tg.ready();
                tg.expand();
                
                // Показываем информацию о пользователе
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    document.getElementById('userInfo').innerHTML = `
                        <strong>ID:</strong> ${user.id}<br>
                        <strong>Имя:</strong> ${user.first_name} ${user.last_name || ''}<br>
                        <strong>Username:</strong> @${user.username || 'не указан'}<br>
                        <strong>Язык:</strong> ${user.language_code || 'не указан'}
                    `;
                    log(`Пользователь: ${user.first_name} (ID: ${user.id})`);
                } else {
                    document.getElementById('userInfo').innerHTML = 'Нет данных пользователя';
                    log('Нет данных пользователя');
                }
            } else {
                document.getElementById('userInfo').innerHTML = 'Не в Telegram Mini App';
                log('Не в Telegram Mini App');
            }
        });
        
        async function checkSubscription() {
            if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                alert('Нет данных пользователя Telegram');
                return;
            }
            
            const userId = tg.initDataUnsafe.user.id;
            log(`Проверяем подписку для пользователя ${userId}`);
            
            try {
                const response = await fetch('/api/check-subscription', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        channel_username: CHANNEL_USERNAME
                    })
                });
                
                log(`Ответ сервера: ${response.status}`);
                
                if (response.ok) {
                    const result = await response.json();
                    log(`Результат: ${JSON.stringify(result)}`);
                    
                    const statusClass = result.is_subscribed ? 'success' : 'error';
                    document.getElementById('subscriptionResult').innerHTML = `
                        <div class="${statusClass}">
                            <strong>Результат:</strong> ${result.is_subscribed ? '✅ Подписан' : '❌ Не подписан'}<br>
                            <strong>Статус:</strong> ${result.status}<br>
                            ${result.error ? `<strong>Ошибка:</strong> ${result.error}` : ''}
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    log(`Ошибка: ${response.status} - ${errorText}`);
                    document.getElementById('subscriptionResult').innerHTML = `
                        <div class="error">
                            <strong>Ошибка API:</strong> ${response.status}<br>
                            ${errorText}
                        </div>
                    `;
                }
            } catch (error) {
                log(`Ошибка: ${error.message}`);
                document.getElementById('subscriptionResult').innerHTML = `
                    <div class="error">
                        <strong>Ошибка:</strong> ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
