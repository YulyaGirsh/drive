version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: easydrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-easydrive}
      POSTGRES_USER: ${DB_USER:-easydrive_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-easydrive_password}
    volumes:
      # Данные БД хранятся в volume (не в Git)
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easydrive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-easydrive_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  easydrive-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: easydrive-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Монтируем config.env для конфигурации
      - ./config.env:/app/config.env:ro
      # Монтируем данные трансляций
      - ./translation_data.json:/app/translation_data.json
      # Монтируем статические файлы (HTML, изображения, конспекты)
      - ./images:/app/images:ro
      - ./conspects:/app/conspects:ro
      # Монтируем данные вопросов
      - ./data.json:/app/data.json:ro
      - ./questions_categorized.json:/app/questions_categorized.json:ro
      - ./questions_categorized_40.json:/app/questions_categorized_40.json:ro
      - ./questions_categorized_40_final.json:/app/questions_categorized_40_final.json:ro
      - ./questions_categorized_final.json:/app/questions_categorized_final.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - DOCKER_CONTAINER=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-easydrive}
      - DB_USER=${DB_USER:-easydrive_user}
      - DB_PASSWORD=${DB_PASSWORD:-easydrive_password}
    networks:
      - easydrive-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    # Данные БД хранятся в Docker volume (не в Git)

networks:
  easydrive-network:
    driver: bridge

