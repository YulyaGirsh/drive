<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест API</title>
</head>
<body>
    <h1>Тест отправки формы</h1>
    <button onclick="testAPI()">Тест API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Отправляем тест...';
            
            try {
                const response = await fetch('/api/send-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        bot_token: '8263208579:AAHbgB-KSmyqZwMf7FtxBbUzjWNIugUtKu0',
                        chat_id: 7644513746,
                        text: '🧪 ТЕСТОВОЕ СООБЩЕНИЕ',
                        parse_mode: 'HTML'
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    resultDiv.innerHTML = '✅ Успешно! Результат: ' + JSON.stringify(result);
                } else {
                    resultDiv.innerHTML = '❌ Ошибка: ' + response.status + ' ' + response.statusText;
                }
            } catch (error) {
                resultDiv.innerHTML = '❌ Ошибка соединения: ' + error.message;
            }
        }
    </script>
</body>
</html>
