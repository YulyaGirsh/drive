<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrive - Видеоуроки</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            padding: 20px;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            color: #ffffff;
            margin-top: 40px;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: inline-block;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border-color: #ff6b35;
        }

        .videos-container {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .video-button {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(255, 140, 0, 0.2);
            min-height: 60px;
        }

        .video-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.3);
        }

        .video-button:active {
            transform: translateY(0);
        }

        .video-title {
            flex: 1;
            line-height: 1.3;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
                margin-top: 35px;
            }
            
            .back-btn {
                padding: 6px 12px;
                font-size: 12px;
                top: 12px;
                left: 12px;
            }
            
            .video-button {
                padding: 14px 16px;
                font-size: 12px;
                min-height: 55px;
            }
            
            .video-title {
                font-size: 11px;
            }
            
        }
    </style>
</head>

    <script src="https://integrationjs.tbank.ru/integration.js" onload="onPaymentIntegrationLoad()" async></script>
    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        
        // Конфигурация
        const CHANNEL_USERNAME = '+w4RmUNIUdKFlMDBi';
        const FREE_VIDEOS_COUNT = 2; // Первые 2 видео доступны всем
        const SUBSCRIPTION_PRICE = 10; // Цена подписки в рублях
        
        // Конфигурация Т-банка (ТЕСТОВЫЙ терминал)
        // ВАЖНО: Тестовые платежи НЕ отображаются в личном кабинете Т-банка!
        const TBANK_TERMINAL_KEY = '1761136519162DEMO'; // Тестовый Terminal Key
        const TBANK_SECRET_KEY = 'TY#iAnEUV*3CS&BI'; // Тестовый Secret Key
        const TBANK_API_URL = 'https://securepay.tinkoff.ru/v2';
        
        // Базовый URL для API запросов (используем Telegram API)
        const API_BASE_URL = 'https://api.telegram.org/bot' + 'YOUR_BOT_TOKEN';
        
        // Глобальная переменная для интеграции Т-банка
        let tbankIntegration = null;
        
        // Данные пользователя из Telegram
        let userData = null;
        let isSubscribed = false; // Проверяем подписку
        let hasPaidSubscription = false; // Проверяем оплаченную подписку
        
        // Инициализация Т-банка (закомментировано, используем прямую интеграцию)
        const initConfig = {
            terminalKey: TBANK_TERMINAL_KEY,
            product: 'eacq',
            features: {
                payment: {} // Кнопки быстрой оплаты
            }
        };
        
        function onPaymentIntegrationLoad() {
            console.log('Т-банк интеграция загружена');
            // Упрощенная инициализация для тестового терминала
            tbankIntegration = {
                terminalKey: TBANK_TERMINAL_KEY,
                secretKey: TBANK_SECRET_KEY
            };
            console.log('Т-банк готов к работе с тестовым терминалом');
        }
        
        // Создание платежа через Т-банк API
        async function createTbankPayment() {
            try {
                // Получаем данные пользователя
                let currentUserData = userData;
                if (!currentUserData && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    currentUserData = tg.initDataUnsafe.user;
                }
                if (!currentUserData) {
                    currentUserData = {
                        id: Date.now(),
                        first_name: 'Test',
                        last_name: 'User'
                    };
                }
                
                // Создаем платеж через наш бэкенд (который вызовет Т-банк API)
                const paymentData = {
                    user_id: currentUserData.id,
                    amount: SUBSCRIPTION_PRICE,
                    description: 'Подписка на видеоуроки EasyDrive',
                    terminal_key: TBANK_TERMINAL_KEY
                };
                
                console.log('Отправляем запрос на создание платежа:', paymentData);
                
                // Используем встроенный helper от Т-банка для запросов
                const response = await new PaymentIntegration.Helpers().request(
                    '/api/tbank-create-payment', 
                    'POST', 
                    paymentData
                );
                
                console.log('Ответ от бэкенда:', response);
                
                if (response && response.paymentUrl) {
                    return response.paymentUrl;
                } else {
                    throw new Error('Не получен paymentUrl от бэкенда');
                }
                
            } catch (error) {
                console.error('Ошибка создания платежа:', error);
                throw error;
            }
        }
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userData = tg.initDataUnsafe.user;
            console.log('Данные пользователя загружены:', userData);
        } else {
            console.log('Telegram WebApp не доступен, используем тестовые данные');
            // Для тестирования в браузере создаем тестового пользователя
            userData = {
                id: 123456789,
                first_name: 'Test',
                last_name: 'User',
                username: 'testuser'
            };
        }
        
        // Проверяем подписку на канал
        async function checkSubscription() {
            if (!tg || !userData) {
                console.log('Не в Telegram Mini App или нет данных пользователя');
                return false;
            }
            
            // Для простоты считаем, что подписка есть у всех пользователей
            // В реальном приложении здесь можно проверить локальное хранилище или другие источники
            isSubscribed = true;
            console.log('Подписка активирована для пользователя:', userData.id);
            return true;
        }
        
        // Проверяем оплаченную подписку
        async function checkPaidSubscription() {
            if (!userData) {
                return false;
            }
            
            // Проверяем локальное хранилище для платной подписки
            const paidSubKey = `paid_subscription_v4_${userData.id}`;
            const paidSubData = localStorage.getItem(paidSubKey);
            
            if (paidSubData) {
                const data = JSON.parse(paidSubData);
                // Проверяем, не истекла ли подписка (например, через 30 дней)
                const subscriptionDate = new Date(data.date);
                const now = new Date();
                const daysDiff = (now - subscriptionDate) / (1000 * 60 * 60 * 24);
                
                if (daysDiff < 30) { // Подписка действует 30 дней
                    hasPaidSubscription = true;
                    return true;
                } else {
                    // Подписка истекла, удаляем из локального хранилища
                    localStorage.removeItem(paidSubKey);
                    hasPaidSubscription = false;
                    return false;
                }
            }
            
            hasPaidSubscription = false;
            return false;
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            // Проверяем подписку и оплаченную подписку
            await checkSubscription();
            await checkPaidSubscription();
            
            // Обновляем интерфейс в зависимости от подписки
            updateVideoButtons();
        });
        
        // Обновляем кнопки видео в зависимости от подписки
        function updateVideoButtons() {
            const videoButtons = document.querySelectorAll('.video-button');
            
            videoButtons.forEach((button, index) => {
                const videoNumber = index + 1;
                
                if (videoNumber > FREE_VIDEOS_COUNT) {
                    if (!hasPaidSubscription) {
                        // Блокируем кнопку для неоплативших пользователей
                        button.style.opacity = '0.6';
                        button.style.cursor = 'not-allowed';
                        button.innerHTML = `
                            <div class="video-title">
                                ${button.querySelector('.video-title').textContent}
                                <br><small style="color: #ffcc00;">🔒 Требуется подписка</small>
                            </div>
                        `;
                    }
                }
            });
        }
        
        // Показываем модальное окно с предложением оплаты
        function showPaymentModal() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                border-radius: 15px;
                padding: 30px;
                max-width: 500px;
                width: 100%;
                text-align: center;
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = `
                position: absolute;
                top: 15px;
                right: 20px;
                background: #ff6b6b;
                color: white;
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const icon = document.createElement('div');
            icon.innerHTML = '💳';
            icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
            
            const title = document.createElement('h2');
            title.textContent = 'Доступ к видеоуроку';
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const message = document.createElement('p');
            message.innerHTML = `
                Для просмотра этого видеоурока требуется оплата <strong>${SUBSCRIPTION_PRICE}₽</strong><br><br>
                Оплата производится картой на тестовом терминале
            `;
            message.style.cssText = 'color: #666; margin-bottom: 25px; line-height: 1.5;';
            
            // Кнопка оплаты картой
            const cardPaymentBtn = document.createElement('button');
            cardPaymentBtn.innerHTML = `💳 Оплатить картой ${SUBSCRIPTION_PRICE}₽`;
            cardPaymentBtn.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                border: none;
                padding: 15px 25px;
                border-radius: 25px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
                margin: 15px 10px 10px 10px;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
                transition: all 0.3s ease;
                width: 100%;
            `;
            cardPaymentBtn.onclick = function() {
                modal.remove();
                showCardPaymentModal();
            };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = 'Отмена';
            cancelBtn.style.cssText = `
                background: #f0f0f0;
                color: #666;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
                margin-top: 15px;
                width: 100%;
            `;
            cancelBtn.onclick = function() {
                modal.remove();
            };
            
            content.appendChild(closeBtn);
            content.appendChild(icon);
            content.appendChild(title);
            content.appendChild(message);
            content.appendChild(cardPaymentBtn);
            content.appendChild(cancelBtn);
            modal.appendChild(content);
            
            document.body.appendChild(modal);
            
            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }
        
        // Инициирование платежа через T-Pay
        async function initiateTpayPayment() {
            try {
                // Получаем данные пользователя
                let currentUserData = userData;
                if (!currentUserData && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    currentUserData = tg.initDataUnsafe.user;
                }
                if (!currentUserData) {
                    currentUserData = {
                        id: Date.now(),
                        first_name: 'Test',
                        last_name: 'User'
                    };
                }
                
                console.log('Инициируем платеж T-Pay для пользователя:', currentUserData);
                
                // Отправляем запрос на инициализацию платежа
                const response = await fetch('/api/tbank-init-payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: currentUserData.id,
                        amount: SUBSCRIPTION_PRICE,
                        description: 'Подписка на видеоуроки EasyDrive',
                        payment_method: 'tpay'
                    })
                });
                
                const result = await response.json();
                console.log('Ответ от бэкенда:', result);
                
                if (result.success && result.payment_url) {
                    // Перенаправляем на страницу оплаты T-Pay
                    window.open(result.payment_url, '_blank');
                } else {
                    alert('Ошибка инициализации платежа: ' + (result.error || 'Неизвестная ошибка'));
                }
                
            } catch (error) {
                console.error('Ошибка при инициировании платежа T-Pay:', error);
                alert('Ошибка при инициировании платежа. Попробуйте еще раз.');
            }
        }
        
        // Инициализация кнопок Т-банка
        async function initTbankPaymentButtons(container) {
            if (!tbankIntegration) {
                console.error('Т-банк интеграция не инициализирована');

                return;
            }
            
            try {
                // Создаем кнопки быстрой оплаты
                const paymentIntegration = await tbankIntegration.payments.create('main-payment', {
                    container: container,
                    amount: SUBSCRIPTION_PRICE * 100, // Сумма в копейках
                    currency: 'RUB',
                    description: 'Подписка на видеоуроки EasyDrive',
                    orderId: `easydrive_${Date.now()}`,
                    // Включаем все доступные способы оплаты
                    widgets: ['sbp', 'tpay', 'card'] // СБП, T-Pay, карты
                });
                
                console.log('Кнопки Т-банка созданы:', paymentIntegration);
                
            } catch (error) {
                console.error('Ошибка создания кнопок Т-банка:', error);
                container.innerHTML = '<p style="color: #ff6b6b;">Ошибка загрузки платежных кнопок</p>';
            }
        }

            const form = document.createElement('form');

            // Поля для ввода данных карты

        // Создание токена для Т-банк API (ПРАВИЛЬНЫЙ порядок полей)
        async function createTbankToken(data) {
            // Функция для создания SHA-256 хеша
            const hashString = async (message) => {
                const encoder = new TextEncoder();
                const data = encoder.encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            };
            
            // Исключаем поле Token из генерации
            const token_data = {};
            for (const key in data) {
                if (key !== "Token" && data[key] !== null && data[key] !== undefined) {
                    token_data[key] = data[key];
                }
            }
            
            // ВАЖНО: используем СТРОГО ОПРЕДЕЛЕННЫЙ порядок полей (не алфавит!)
            let tokenString = '';
            console.log('🔐 Шаг 1: Формируем строку для токена из полей (в строгом порядке)');
            
            // Amount
            if (token_data["Amount"] !== null && token_data["Amount"] !== undefined) {
                const value = String(token_data["Amount"]);
                tokenString += value;
                console.log(`  Amount: ${value}`);
            }
            
            // Description
            if (token_data["Description"] !== null && token_data["Description"] !== undefined) {
                const value = String(token_data["Description"]);
                tokenString += value;
                console.log(`  Description: ${value}`);
            }
            
            // FailURL
            if (token_data["FailURL"] !== null && token_data["FailURL"] !== undefined) {
                const value = String(token_data["FailURL"]);
                tokenString += value;
                console.log(`  FailURL: ${value}`);
            }
            
            // OrderId
            if (token_data["OrderId"] !== null && token_data["OrderId"] !== undefined) {
                const value = String(token_data["OrderId"]);
                tokenString += value;
                console.log(`  OrderId: ${value}`);
            }
            
            // SuccessURL
            if (token_data["SuccessURL"] !== null && token_data["SuccessURL"] !== undefined) {
                const value = String(token_data["SuccessURL"]);
                tokenString += value;
                console.log(`  SuccessURL: ${value}`);
            }
            
            // TerminalKey
            if (token_data["TerminalKey"] !== null && token_data["TerminalKey"] !== undefined) {
                const value = String(token_data["TerminalKey"]);
                tokenString += value;
                console.log(`  TerminalKey: ${value}`);
            }
            
            console.log('📝 Промежуточная строка (до добавления секрета):', tokenString);
            console.log('🔑 Добавляем Secret Key:', TBANK_SECRET_KEY);
            
            // Добавляем секретный ключ в конец
            tokenString += TBANK_SECRET_KEY;
            
            console.log('📋 Полная строка для токена (первые 200 символов):', tokenString.substring(0, 200));
            console.log('📊 Длина строки:', tokenString.length);
            
            // Создаем SHA-256 хеш
            const token = await hashString(tokenString);
            
            console.log('✅ Сгенерированный токен:', token);
            console.log('📏 Длина токена:', token.length);
            
            return token;
        }

                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                border-radius: 15px;
                padding: 30px;
                max-width: 400px;
                width: 100%;
                text-align: center;
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = `
                position: absolute;
                top: 15px;
                right: 20px;
                background: #ff6b6b;
                color: white;
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const icon = document.createElement('div');
            icon.innerHTML = '🔒';
            icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
            
            const title = document.createElement('h2');
            title.textContent = 'Доступ ограничен';
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const message = document.createElement('p');
            message.innerHTML = `
                Это видео доступно только подписчикам канала<br><br>
                Подпишитесь на канал, чтобы получить доступ ко всем видеоурокам!
            `;
            message.style.cssText = 'color: #666; margin-bottom: 25px; line-height: 1.5;';
            
            const subscribeBtn = document.createElement('button');
            subscribeBtn.innerHTML = '📺 Подписаться на канал';
            subscribeBtn.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                border: none;
                padding: 15px 25px;
                border-radius: 25px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 15px;
                width: 100%;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
            `;
            subscribeBtn.onclick = function() {
                window.open(`https://t.me/${CHANNEL_USERNAME}`, '_blank');
                modal.remove();
            };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = 'Отмена';
            cancelBtn.style.cssText = `
                background: #f0f0f0;
                color: #666;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
            `;
            cancelBtn.onclick = function() {
                modal.remove();
            };
            
            content.appendChild(closeBtn);
            content.appendChild(icon);
            content.appendChild(title);
            content.appendChild(message);
            content.appendChild(subscribeBtn);
            content.appendChild(cancelBtn);
            modal.appendChild(content);
            
            document.body.appendChild(modal);
            
            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }
        
        function openConspect(videoNumber) {
            const pdfFile = conspects[videoNumber];
            if (Array.isArray(pdfFile)) {
                // Для темы 18-23 показываем все конспекты
                alert('Для этого видео доступно несколько конспектов. Выберите нужный из списка.');
            } else if (pdfFile) {
                window.open(`conspects/${pdfFile}`, '_blank');
            } else {
                alert('Конспект для данного видеоурока не найден');
            }
        }
        
        function openConspectByFile(pdfFile) {
            window.open(`conspects/${pdfFile}`, '_blank');
        }
    </script>
</body>
</html>
