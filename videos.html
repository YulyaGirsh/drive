<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrive - Видеоуроки</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            padding: 20px;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            color: #ffffff;
            margin-top: 40px;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: inline-block;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border-color: #ff6b35;
        }

        .videos-container {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .video-button {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(255, 140, 0, 0.2);
            min-height: 60px;
        }

        .video-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.3);
        }

        .video-button:active {
            transform: translateY(0);
        }

        .video-title {
            flex: 1;
            line-height: 1.3;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
                margin-top: 35px;
            }
            
            .back-btn {
                padding: 6px 12px;
                font-size: 12px;
                top: 12px;
                left: 12px;
            }
            
            .video-button {
                padding: 14px 16px;
                font-size: 12px;
                min-height: 55px;
            }
            
            .video-title {
                font-size: 11px;
            }
            
        }
    </style>
</head>
<body>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        
        // Конфигурация
        const CHANNEL_USERNAME = '+w4RmUNIUdKFlMDBi';
        const FREE_VIDEOS_COUNT = 2; // Первые 2 видео доступны всем
        const SUBSCRIPTION_PRICE = 10; // Цена подписки в рублях
        
        // Базовый URL для API запросов
        const API_BASE_URL = window.location.protocol + '//' + window.location.host;
        
        // Данные пользователя из Telegram
        let userData = null;
        let isSubscribed = false; // Проверяем подписку
        let hasPaidSubscription = false; // Проверяем оплаченную подписку
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userData = tg.initDataUnsafe.user;
            console.log('Данные пользователя загружены:', userData);
        } else {
            console.log('Telegram WebApp не доступен, используем тестовые данные');
            // Для тестирования в браузере создаем тестового пользователя
            userData = {
                id: 123456789,
                first_name: 'Test',
                last_name: 'User',
                username: 'testuser'
            };
        }
        
        // Проверяем подписку на канал
        async function checkSubscription() {
            if (!tg || !userData) {
                console.log('Не в Telegram Mini App или нет данных пользователя');
                return false;
            }
            
            try {
                // Отправляем запрос на сервер для проверки подписки
                const response = await fetch(`${API_BASE_URL}/api/check-subscription`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userData.id,
                        channel_username: CHANNEL_USERNAME
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    isSubscribed = result.is_subscribed;
                    return isSubscribed;
                } else {
                    console.error('Ошибка проверки подписки:', response.status);
                    return false;
                }
                
            } catch (error) {
                console.error('Ошибка проверки подписки:', error);
                return false;
            }
        }
        
        // Проверяем оплаченную подписку
        async function checkPaidSubscription() {
            if (!userData) {
                return false;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/check-paid-subscription`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userData.id
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    hasPaidSubscription = result.has_paid_subscription;
                    return hasPaidSubscription;
                } else {
                    console.error('Ошибка проверки оплаченной подписки:', response.status);
                    return false;
                }
                
            } catch (error) {
                console.error('Ошибка проверки оплаченной подписки:', error);
                return false;
            }
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            // Проверяем подписку и оплаченную подписку
            await checkSubscription();
            await checkPaidSubscription();
            
            // Обновляем интерфейс в зависимости от подписки
            updateVideoButtons();
            
            // Показываем уведомление для браузерной версии
            if (!tg) {
                showBrowserNotification();
            }
        });
        
        // Обновляем кнопки видео в зависимости от подписки
        function updateVideoButtons() {
            const videoButtons = document.querySelectorAll('.video-button');
            
            videoButtons.forEach((button, index) => {
                const videoNumber = index + 1;
                
                if (videoNumber > FREE_VIDEOS_COUNT) {
                    if (!hasPaidSubscription) {
                        // Блокируем кнопку для неоплативших пользователей
                        button.style.opacity = '0.6';
                        button.style.cursor = 'not-allowed';
                        button.innerHTML = `
                            <div class="video-title">
                                ${button.querySelector('.video-title').textContent}
                                <br><small style="color: #ffcc00;">🔒 Требуется подписка</small>
                            </div>
                        `;
                    }
                }
            });
        }
        
        // Показываем уведомление для браузерной версии
        function showBrowserNotification() {
            const notification = document.createElement('div');
            notification.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                padding: 15px;
                margin: 10px 0;
                border-radius: 10px;
                text-align: center;
                font-weight: 600;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
            `;
            notification.innerHTML = `
                📺 <strong>Полный доступ к видеоурокам</strong><br>
                Первые 2 урока доступны бесплатно, остальные - по подписке за ${SUBSCRIPTION_PRICE}₽<br>
                <button onclick="showPaymentModal()" style="background: #ffcc00; color: #333; border: none; padding: 8px 16px; border-radius: 20px; margin-top: 8px; cursor: pointer; font-weight: 600;">
                    💳 Купить подписку
                </button>
            `;
            
            const videosContainer = document.querySelector('.videos-container');
            videosContainer.insertBefore(notification, videosContainer.firstChild);
        }
        
        // Показываем модальное окно с предложением оплаты
        function showPaymentModal() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                border-radius: 15px;
                padding: 30px;
                max-width: 400px;
                width: 100%;
                text-align: center;
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = `
                position: absolute;
                top: 15px;
                right: 20px;
                background: #ff6b6b;
                color: white;
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const icon = document.createElement('div');
            icon.innerHTML = '💳';
            icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
            
            const title = document.createElement('h2');
            title.textContent = 'Получите полный доступ';
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const message = document.createElement('p');
            message.innerHTML = `
                Разблокируйте все видеоуроки за <strong>${SUBSCRIPTION_PRICE}₽</strong><br><br>
                • Доступ ко всем урокам навсегда<br>
                • Без рекламы<br>
                • Поддержка 24/7
            `;
            message.style.cssText = 'color: #666; margin-bottom: 25px; line-height: 1.5;';
            
            // Кнопка оплаты
            const paymentBtn = document.createElement('button');
            paymentBtn.innerHTML = `💳 Оплатить ${SUBSCRIPTION_PRICE}₽`;
            paymentBtn.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                border: none;
                padding: 15px 25px;
                border-radius: 25px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 15px;
                width: 100%;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
            `;
            paymentBtn.onclick = function() {
                processPayment();
                modal.remove();
            };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = 'Отмена';
            cancelBtn.style.cssText = `
                background: #f0f0f0;
                color: #666;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
            `;
            cancelBtn.onclick = function() {
                modal.remove();
            };
            
            content.appendChild(closeBtn);
            content.appendChild(icon);
            content.appendChild(title);
            content.appendChild(message);
            content.appendChild(paymentBtn);
            content.appendChild(cancelBtn);
            modal.appendChild(content);
            
            document.body.appendChild(modal);
            
            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }
        
        // Модальное окно оплаты картой
        function showCardPaymentModal() {

            modal.style.cssText = `
                position: fixed;

                display: flex;

            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;

                color: white;
                border: none;

            document.body.appendChild(modal);

                }

        // Модальное окно оплаты СБП
        function showSBPPaymentModal() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                border-radius: 15px;
                padding: 30px;
                max-width: 500px;
                width: 100%;
                text-align: center;
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = `
                position: absolute;
                top: 15px;
                right: 20px;
                background: #ff6b6b;
                color: white;
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const icon = document.createElement('div');
            icon.innerHTML = '📱';
            icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
            
            const title = document.createElement('h2');
            title.textContent = 'Оплата через СБП';
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const qrCode = document.createElement('div');
            qrCode.style.cssText = `
                background: #f5f5f5;
                border: 2px dashed #ddd;
                border-radius: 10px;
                padding: 20px;
                margin: 20px 0;
                text-align: center;
            `;
            qrCode.innerHTML = `
                <div style="font-size: 48px; margin-bottom: 10px;">📱</div>
                <div style="color: #666; font-size: 14px;">QR-код для оплаты</div>
                <div style="color: #333; font-weight: 600; margin-top: 10px;">${SUBSCRIPTION_PRICE}₽</div>
            `;
