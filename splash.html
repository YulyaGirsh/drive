<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД Экзамен - Загрузка</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            position: relative;
        }

        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .logo {
            width: 200px;
            height: 200px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: logoAppear 4s ease-out forwards;
            opacity: 0;
            transform: scale(0.3);
        }

        .logo-glow {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #ff6b6b, #ff8c00, #ffa500, #ffd700, #feca57);
            border-radius: 15px;
            z-index: -1;
            animation: glowPulse 3s ease-in-out infinite;
            opacity: 0;
        }



        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin: 20px auto;
            overflow: hidden;
            opacity: 0;
            animation: textFadeIn 1s ease-out 2s forwards;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff8c00, #ffa500);
            border-radius: 2px;
            width: 0%;
            animation: progressFill 3s ease-out 2.5s forwards;
        }


        @keyframes logoAppear {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }


        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes progressFill {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }


        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.8);
            }
        }

    </style>
</head>
<body>

    <div class="splash-container">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="logo2.png?v=2" alt="ПДД Экзамен" class="logo" onerror="this.src='logo.png?v=1'; this.onerror=null;">
        </div>
        
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>

        // Переход к основному приложению через 5 секунд
        setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }, 5000);

        // Добавляем интерактивность - клик для быстрого перехода
        document.addEventListener('click', () => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        });

        // Добавляем эффект при наведении на логотип
        const logo = document.querySelector('.logo');
        logo.addEventListener('mouseenter', () => {
            logo.style.transform = 'scale(1.1)';
            logo.style.transition = 'transform 0.3s ease';
        });

        logo.addEventListener('mouseleave', () => {
            logo.style.transform = 'scale(1)';
        });
    </script>
</body>
</html>
