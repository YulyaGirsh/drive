    <script>
        async function openTickets() {

        async function checkChannelSubscription() {
            try {
                console.log('🔍 Начинаем проверку подписки на канал @avtoshkolavtelefone...');
                
                // Получаем Telegram WebApp API
                const tg = window.Telegram?.WebApp;
                
                console.log('📦 Telegram WebApp:', tg);
                console.log('📦 initDataUnsafe:', tg?.initDataUnsafe);
                console.log('📦 user:', tg?.initDataUnsafe?.user);
                
                // Получаем user_id если доступен
                let userId = null;
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    userId = tg.initDataUnsafe.user.id;
                    console.log('👤 ID пользователя:', userId);
                } else {
                    console.log('⚠️ Telegram WebApp не доступен - продолжаем без user_id');
                }
                
                // ВСЕГДА делаем запрос на сервер БЕЗ кэширования
                const requestData = {
                    user_id: userId,
                    channel: 'avtoshkolavtelefone'
                };
                
                console.log('📤 Отправляем запрос на /api/check-channel-subscription...');
                console.log('📋 Данные запроса:', requestData);
                
                console.log('📡 Отправляем запрос на сервер...');
                console.log('📤 Данные запроса:', JSON.stringify(requestData));
                
                const response = await fetch('/api/check-channel-subscription', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });
                
                console.log('📥 Ответ от сервера получен');
                console.log('📊 Статус ответа:', response.status, response.statusText);
                console.log('📋 Заголовки ответа:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    console.error('❌ Ошибка проверки подписки:', response.status);
                    const errorText = await response.text();
                    console.error('Текст ошибки:', errorText);
                    // Даже при ошибке пытаемся получить JSON ответ
                    try {
                        const errorResult = JSON.parse(errorText);
                        if (errorResult.subscribed !== undefined) {
                            return Boolean(errorResult.subscribed);
                        }
                    } catch (e) {
                        console.error('Не удалось распарсить ошибку как JSON');
                    }
                    return false;
                }
                
                const result = await response.json();
                console.log('📦 Полный результат от сервера:', JSON.stringify(result));
                console.log('✅ result.subscribed:', result.subscribed);
                console.log('🔢 Тип result.subscribed:', typeof result.subscribed);
                
                // Проверяем наличие поля subscribed
                if (result.subscribed === undefined) {
                    console.error('❌ В ответе отсутствует поле subscribed');
                    console.error('Полный ответ:', result);
                    return false;
                }
                
                const finalResult = Boolean(result.subscribed);
                console.log('📝 Результат после приведения к boolean:', finalResult);
                console.log('🎯 ФИНАЛЬНЫЙ РЕЗУЛЬТАТ ПРОВЕРКИ:', finalResult ? 'ПОДПИСАН ✅' : 'НЕ ПОДПИСАН ❌');
                
                // Если есть ошибка, логируем её
                if (result.error) {
                    console.warn('⚠️ Ошибка при проверке подписки:', result.error);
                }
                
                return finalResult;
                
            } catch (error) {
                console.error('❌ Ошибка при проверке подписки:', error);
                return false;
            }
        }

        // Глобальная переменная для оплаченной подписки
        let hasPaidSubscription = false;
        const SUBSCRIPTION_PRICE = 2990; // Цена подписки в рублях

        // Проверяем оплаченную подписку (как в parking.html)
        async function checkPaidSubscription() {
            console.log('🔍 checkPaidSubscription: Начинаем проверку оплаты');
            
            const tg = window.Telegram?.WebApp;
            console.log('📦 Telegram WebApp:', tg);
            
            let currentUserData = null;
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                currentUserData = tg.initDataUnsafe.user;
                console.log('✅ Получены данные пользователя:', currentUserData);
            } else {
                console.log('⚠️ Telegram WebApp не доступен');
                hasPaidSubscription = false;
                return false;
            }
            
            if (!currentUserData) {
                console.log('❌ checkPaidSubscription: Нет данных пользователя');
                hasPaidSubscription = false;
                return false;
            }
            
            console.log('🔍 checkPaidSubscription: Проверяем подписку через сервер для user_id:', currentUserData.id);
            
            try {
                const response = await fetch('/api/check-paid-subscription', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserData.id })
                });
                
                if (response.ok) {
                    const serverData = await response.json();
                    console.log('📦 Ответ сервера о подписке:', serverData);
                    
                    if (serverData.has_paid_subscription) {
                        console.log('✅ Подписка найдена на сервере');
                        hasPaidSubscription = true;
                        return true;
                    }
                }
            } catch (error) {
                console.error('❌ Ошибка проверки подписки на сервере:', error);
            }
            
            console.log('❌ checkPaidSubscription: Подписка НЕ найдена на сервере');
            hasPaidSubscription = false;
            return false;
        }
