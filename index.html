<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrive - Подготовка к экзамену на права (Auto-deploy working!)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Показываем заставку только при самом первом заходе
        window.addEventListener('load', function() {
            // Проверяем, не показывали ли уже заставку в этой сессии
            if (!sessionStorage.getItem('splashShown')) {
                sessionStorage.setItem('splashShown', 'true');
                window.location.href = 'splash.html';
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Скрываем любые возможные точки загрузки */
        body::before,
        body::after,
        *::before,
        *::after {
            content: none !important;
        }

        /* Скрываем элементы с белыми точками */
        [class*="dot"],
        [class*="particle"],
        [class*="loading"],
        [class*="indicator"] {
            display: none !important;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #ffffff;
            color: #ff8c00;
            padding: 20px;
            text-align: left;
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* Скрываем любые точки в области заголовка, кроме логотипа */
        .header *:not(.header-logo) {
            background-image: none !important;
        }

        .header::before,
        .header::after {
            display: none !important;
        }

        .header-content {
            flex: 1;
        }

        .header-logo {
            width: 100px;
            height: 100px;
            background-image: url('logo_gorizont1.png') !important;
            background-size: contain !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            flex-shrink: 0;
            display: block !important;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 140, 0, 0.3);
            margin: 0;
            color: #ff8c00;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(255, 140, 0, 0.2);
            margin: 0;
            color: #ff8c00;
        }

        .sections {
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
            overflow-y: auto;
        }

        .section-row {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }

        .section-row:last-child {
            justify-content: flex-start;
            gap: 20px;
        }

        .section-row:last-child .section-block {
            flex: 0 0 calc(50% - 10px);
        }

        .section-block {
            background: #ffffff;
            border-radius: 20px;
            padding: 0;
            border: 2px solid #ff8c00;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            flex: 1;
        }

        .section-block:hover {
            border-color: #ff6b35;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.25);
        }

        .section-block:last-child {
            margin-bottom: 0;
        }

        .section-icon {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 18px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #000000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 12px;
            margin: 8px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }



        @media (max-width: 480px) {
            .container {
                margin: 0;
                border-radius: 0;
            }
            
            .header {
                padding: 15px;
                min-height: 80px;
                flex-direction: row;
                text-align: left;
                background: #ffffff;
                justify-content: space-between;
                align-items: center;
            }
            
            .header-content {
                flex: 1;
            }
            
            .header-logo {
                width: 60px;
                height: 60px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .header p {
                font-size: 14px;
            }
            
            .sections {
                padding: 20px 12px;
                gap: 25px;
            }

            .section-row {
                gap: 15px;
            }

            .section-row:last-child .section-block {
                flex: 0 0 calc(50% - 7.5px);
            }
            
            .section-block {
                aspect-ratio: 1;
                padding: 0;
                flex-direction: column;
                text-align: center;
                align-items: center;
                justify-content: flex-end;
            }
            
            .section-icon {
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
            }
            
            .section-title {
                font-size: 14px;
                margin: 6px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Разделы</h1>
                <p>Выберите раздел для изучения</p>
            </div>
            <div class="header-logo"></div>
        </div>
        
        <div class="sections">
            <div class="section-row">
                <div class="section-block" onclick="openTickets()">
                    <div class="section-icon" style="background-image: url('images/icons/1.jpg');"></div>
                    <div class="section-title">Билеты</div>
                </div>
                
                <div class="section-block" onclick="openVideos()">
                    <div class="section-icon" style="background-image: url('images/icons/2.jpg');"></div>
                    <div class="section-title">Видеоуроки</div>
                </div>
            </div>

            <div class="section-row">
                <div class="section-block" onclick="openTeacher()">
                    <div class="section-icon" style="background-image: url('images/icons/3.jpg');"></div>
                    <div class="section-title">Преподаватель ПДД</div>
                </div>

                <div class="section-block" onclick="openLawyer()">
                    <div class="section-icon" style="background-image: url('images/icons/4.jpg');"></div>
                    <div class="section-title">Автоюрист</div>
                </div>
            </div>

            <div class="section-row">
                <div class="section-block" onclick="openPsychologist()">
                    <div class="section-icon" style="background-image: url('images/icons/5.jpg');"></div>
                    <div class="section-title">Автопсихолог</div>
                </div>

                <div class="section-block" onclick="openParking()">
                    <div class="section-icon" style="background-image: url('images/icons/6.jpg');"></div>
                    <div class="section-title">Курс по парковке</div>
                </div>
            </div>

            <div class="section-row">
                <div class="section-block" onclick="openTranslations()">
                    <div class="section-icon" style="background-image: url('images/icons/7.jpg');"></div>
                    <div class="section-title">Трансляции</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openTickets() {
            window.location.href = '1.html';
        }

        function openVideos() {
            window.location.href = 'videos.html';
        }

        function openTeacher() {
            window.open('https://t.me/EasyDrivePDD', '_blank');
        }

        function openLawyer() {
            window.location.href = 'lawyer.html';
        }

        function openPsychologist() {
            window.location.href = 'psychologist.html';
        }

        function openParking() {
            window.location.href = 'parking.html';
        }

        function openTranslations() {
            window.location.href = 'translations.html';
        }
    </script>
</body>
</html>
