<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDrive - Восстановление навыков</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            padding: 20px;
            text-align: center;
            position: relative;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            color: #ffffff;
            margin-top: 40px;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: inline-block;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border-color: #ff6b35;
        }

        .videos-container {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .video-button {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            color: white;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(255, 140, 0, 0.2);
            min-height: 60px;
        }

        .video-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.3);
        }

        .video-button:active {
            transform: translateY(0);
        }

        .video-title {
            flex: 1;
            line-height: 1.3;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
                margin-top: 35px;
            }
            
            .back-btn {
                padding: 6px 12px;
                font-size: 12px;
                top: 12px;
                left: 12px;
            }
            
            .video-button {
                padding: 14px 16px;
                font-size: 12px;
                min-height: 55px;
            }
            
            .video-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">← Назад к разделам</a>
            
            <h1>🚗 Восстановление навыков</h1>
        </div>
        
        <div class="videos-container">
            <button class="video-button" onclick="openVideo(0)">
                <div class="video-title">Вводный урок</div>
            </button>
            
            <button class="video-button" onclick="openVideo(1)">
                <div class="video-title">Урок 1. Откуда берется страх?</div>
            </button>
            
            <button class="video-button" onclick="openVideo(2)">
                <div class="video-title">Урок 2. Практика</div>
            </button>
            
            <button class="video-button" onclick="openVideo(3)">
                <div class="video-title">Урок 3. Парковка</div>
            </button>
            
            <button class="video-button" onclick="openVideo(4)">
                <div class="video-title">Урок 4. Ночная езда</div>
            </button>
            
            <button class="video-button" onclick="openVideo(5)">
                <div class="video-title">Урок 5. Как ездить в потоке?</div>
            </button>
            
            <button class="video-button" onclick="openVideo(6)">
                <div class="video-title">Урок 6. Езда вне города</div>
            </button>
            
            <button class="video-button" onclick="openVideo(7)">
                <div class="video-title">Заключение</div>
            </button>
            
            <button class="video-button" onclick="openVideo(8)">
                <div class="video-title">Бонус 1. Дополнительные техники</div>
            </button>
            
            <button class="video-button" onclick="openVideo(9)">
                <div class="video-title">Бонус 2. Продвинутые методы</div>
            </button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Telegram WebApp API
        const tg = window.Telegram?.WebApp;
        
        // Конфигурация
        const CHANNEL_USERNAME = '+w4RmUNIUdKFlMDBi';
        const FREE_VIDEOS_COUNT = 1; // Только вводный урок доступен бесплатно
        const SUBSCRIPTION_PRICE = 10; // Цена подписки в рублях
        
        // Данные пользователя из Telegram
        let userData = null;
        let isSubscribed = false; // Проверяем подписку
        let hasPaidSubscription = false; // Проверяем оплаченную подписку
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userData = tg.initDataUnsafe.user;
            console.log('Данные пользователя загружены:', userData);
        } else {
            console.log('Telegram WebApp не доступен, используем тестовые данные');
            // Для тестирования в браузере создаем тестового пользователя
            userData = {
                id: 123456789,
                first_name: 'Test',
                last_name: 'User',
                username: 'testuser'
            };
        }
        
        // Проверяем подписку на канал
        async function checkSubscription() {
            if (!tg || !userData) {
                console.log('Не в Telegram Mini App или нет данных пользователя');
                return false;
            }
            
            try {
                // Отправляем запрос на сервер для проверки подписки
                const response = await fetch('/api/check-subscription', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userData.id,
                        channel_username: CHANNEL_USERNAME
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    isSubscribed = result.is_subscribed;
                    return isSubscribed;
                } else {
                    console.error('Ошибка проверки подписки:', response.status);
                    return false;
                }
                
            } catch (error) {
                console.error('Ошибка проверки подписки:', error);
                return false;
            }
        }
        
        // Проверяем оплаченную подписку
        async function checkPaidSubscription() {
            if (!userData) {
                return false;
            }
            
            try {
                const response = await fetch('/api/check-paid-subscription', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userData.id
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    hasPaidSubscription = result.has_paid_subscription;
                    return hasPaidSubscription;
                } else {
                    console.error('Ошибка проверки оплаченной подписки:', response.status);
                    return false;
                }
                
            } catch (error) {
                console.error('Ошибка проверки оплаченной подписки:', error);
                return false;
            }
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            // Проверяем подписку и оплаченную подписку
            await checkSubscription();
            await checkPaidSubscription();
            
            // Обновляем интерфейс в зависимости от подписки
            updateVideoButtons();
            
            // Показываем уведомление для браузерной версии
            if (!tg) {
                showBrowserNotification();
            }
        });
        
        // Обновляем кнопки видео в зависимости от подписки
        function updateVideoButtons() {
            const videoButtons = document.querySelectorAll('.video-button');
            
            videoButtons.forEach((button, index) => {
                const videoNumber = index;
                
                if (videoNumber >= FREE_VIDEOS_COUNT) {
                    if (!hasPaidSubscription) {
                        // Блокируем кнопку для неоплативших пользователей
                        button.style.opacity = '0.6';
                        button.style.cursor = 'not-allowed';
                        button.innerHTML = `
                            <div class="video-title">
                                ${button.querySelector('.video-title').textContent}
                                <br><small style="color: #ffcc00;">🔒 Требуется подписка</small>
                            </div>
                        `;
                    }
                }
            });
        }
        
        // Показываем уведомление для браузерной версии
        function showBrowserNotification() {
            const notification = document.createElement('div');
            notification.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                padding: 15px;
                margin: 10px 0;
                border-radius: 10px;
                text-align: center;
                font-weight: 600;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
            `;
            notification.innerHTML = `
                🚗 <strong>Полный доступ к курсу восстановления навыков</strong><br>
                Вводный урок доступен бесплатно, остальные - по подписке за ${SUBSCRIPTION_PRICE}₽<br>
                <button onclick="showPaymentModal()" style="background: #ffcc00; color: #333; border: none; padding: 8px 16px; border-radius: 20px; margin-top: 8px; cursor: pointer; font-weight: 600;">
                    💳 Купить подписку
                </button>
            `;
            
            const videosContainer = document.querySelector('.videos-container');
            videosContainer.insertBefore(notification, videosContainer.firstChild);
        }
        
        // Показываем модальное окно с предложением оплаты
        function showPaymentModal() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                border-radius: 15px;
                padding: 30px;
                max-width: 400px;
                width: 100%;
                text-align: center;
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = `
                position: absolute;
                top: 15px;
                right: 20px;
                background: #ff6b6b;
                color: white;
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const icon = document.createElement('div');
            icon.innerHTML = '💳';
            icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
            
            const title = document.createElement('h2');
            title.textContent = 'Получите полный доступ';
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const message = document.createElement('p');
            message.innerHTML = `
                Разблокируйте все уроки восстановления навыков за <strong>${SUBSCRIPTION_PRICE}₽</strong><br><br>
                • Доступ ко всем урокам навсегда<br>
                • Без рекламы<br>
                • Поддержка 24/7
            `;
            message.style.cssText = 'color: #666; margin-bottom: 25px; line-height: 1.5;';
            
            const paymentBtn = document.createElement('button');
            paymentBtn.innerHTML = `💳 Оплатить ${SUBSCRIPTION_PRICE}₽`;
            paymentBtn.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                border: none;
                padding: 15px 25px;
                border-radius: 25px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 15px;
                width: 100%;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
            `;
            paymentBtn.onclick = function() {
                processPayment();
                modal.remove();
            };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = 'Отмена';
            cancelBtn.style.cssText = `
                background: #f0f0f0;
                color: #666;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
            `;
            cancelBtn.onclick = function() {
                modal.remove();
            };
            
            content.appendChild(closeBtn);
            content.appendChild(icon);
            content.appendChild(title);
            content.appendChild(message);
            content.appendChild(paymentBtn);
            content.appendChild(cancelBtn);
            modal.appendChild(content);
            
            document.body.appendChild(modal);
            
            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }
        
        // Обработка оплаты
        async function processPayment() {
            // Получаем данные пользователя из Telegram или создаем тестовые
            let currentUserData = userData;
            
            if (!currentUserData && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                currentUserData = tg.initDataUnsafe.user;
            }
            
            if (!currentUserData) {
                // Для тестирования создаем тестового пользователя
                currentUserData = {
                    id: Date.now(), // Используем timestamp как ID
                    first_name: 'Test',
                    last_name: 'User'
                };
                console.log('Используем тестового пользователя:', currentUserData);
            }
            
            try {
                // Показываем информацию о платеже
                const paymentInfo = `
💳 <b>Информация для оплаты</b>

🏦 <b>Банк:</b> Т-банк
💳 <b>Номер кошелька:</b> 1761136519162DEMO
💰 <b>Сумма:</b> ${SUBSCRIPTION_PRICE}₽
📝 <b>Комментарий:</b> ${currentUserData.id}

После оплаты нажмите кнопку "Подтвердить оплату"
                `;
                
                const confirmModal = document.createElement('div');
                confirmModal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    z-index: 1001;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    padding: 20px;
                `;
                
                const confirmContent = document.createElement('div');
                confirmContent.style.cssText = `
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    max-width: 500px;
                    width: 100%;
                    text-align: center;
                    position: relative;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                `;
                
                const closeConfirmBtn = document.createElement('button');
                closeConfirmBtn.innerHTML = '×';
                closeConfirmBtn.style.cssText = `
                    position: absolute;
                    top: 15px;
                    right: 20px;
                    background: #ff6b6b;
                    color: white;
                    border: none;
                    border-radius: 50%;
                    width: 30px;
                    height: 30px;
                    cursor: pointer;
                    font-size: 18px;
                    font-weight: bold;
                `;
                closeConfirmBtn.onclick = function() {
                    confirmModal.remove();
                };
                
                const paymentText = document.createElement('div');
                paymentText.innerHTML = paymentInfo.replace(/\n/g, '<br>');
                paymentText.style.cssText = 'color: #333; margin-bottom: 25px; text-align: left; font-family: monospace; background: #f5f5f5; padding: 15px; border-radius: 8px;';
                
                const confirmBtn = document.createElement('button');
                confirmBtn.innerHTML = '✅ Подтвердить оплату';
                confirmBtn.style.cssText = `
                    background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
                    color: white;
                    border: none;
                    padding: 15px 25px;
                    border-radius: 25px;
                    cursor: pointer;
                    font-size: 16px;
                    font-weight: 600;
                    margin-bottom: 15px;
                    width: 100%;
                    box-shadow: 0 3px 10px rgba(40, 167, 69, 0.3);
                `;
                confirmBtn.onclick = async function() {
                    await confirmPayment();
                    confirmModal.remove();
                };
                
                const cancelConfirmBtn = document.createElement('button');
                cancelConfirmBtn.innerHTML = 'Отмена';
                cancelConfirmBtn.style.cssText = `
                    background: #f0f0f0;
                    color: #666;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 20px;
                    cursor: pointer;
                    font-size: 14px;
                `;
                cancelConfirmBtn.onclick = function() {
                    confirmModal.remove();
                };
                
                confirmContent.appendChild(closeConfirmBtn);
                confirmContent.appendChild(paymentText);
                confirmContent.appendChild(confirmBtn);
                confirmContent.appendChild(cancelConfirmBtn);
                confirmModal.appendChild(confirmContent);
                
                document.body.appendChild(confirmModal);
                
            } catch (error) {
                console.error('Ошибка при обработке платежа:', error);
                alert('Ошибка при обработке платежа. Попробуйте еще раз.');
            }
        }
        
        // Подтверждение оплаты
        async function confirmPayment() {
            // Получаем данные пользователя
            let currentUserData = userData;
            
            if (!currentUserData && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                currentUserData = tg.initDataUnsafe.user;
            }
            
            if (!currentUserData) {
                currentUserData = {
                    id: Date.now(),
                    first_name: 'Test',
                    last_name: 'User'
                };
            }
            
            try {
                const response = await fetch('/api/confirm-payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: currentUserData.id,
                        amount: SUBSCRIPTION_PRICE,
                        payment_method: 'tbank'
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        hasPaidSubscription = true;
                        updateVideoButtons();
                        alert('✅ Оплата подтверждена! Теперь у вас есть доступ ко всем урокам восстановления навыков!');
                    } else {
                        alert('❌ Ошибка подтверждения оплаты: ' + (result.message || 'Неизвестная ошибка'));
                    }
                } else {
                    alert('❌ Ошибка сервера при подтверждении оплаты');
                }
                
            } catch (error) {
                console.error('Ошибка подтверждения оплаты:', error);
                alert('❌ Ошибка при подтверждении оплаты. Попробуйте еще раз.');
            }
        }
        
        // Показываем модальное окно с предложением подписки
        function showSubscriptionModal() {
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.8);
                z-index: 1000;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            `;
            
            const content = document.createElement('div');
            content.style.cssText = `
                background: white;
                border-radius: 15px;
                padding: 30px;
                max-width: 400px;
                width: 100%;
                text-align: center;
                position: relative;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            `;
            
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '×';
            closeBtn.style.cssText = `
                position: absolute;
                top: 15px;
                right: 20px;
                background: #ff6b6b;
                color: white;
                border: none;
                border-radius: 50%;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 18px;
                font-weight: bold;
            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const icon = document.createElement('div');
            icon.innerHTML = '🔒';
            icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
            
            const title = document.createElement('h2');
            title.textContent = 'Доступ ограничен';
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const message = document.createElement('p');
            message.innerHTML = `
                Это видео доступно только подписчикам канала<br><br>
                Подпишитесь на канал, чтобы получить доступ ко всем урокам восстановления навыков!
            `;
            message.style.cssText = 'color: #666; margin-bottom: 25px; line-height: 1.5;';
            
            const subscribeBtn = document.createElement('button');
            subscribeBtn.innerHTML = '🚗 Подписаться на канал';
            subscribeBtn.style.cssText = `
                background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                color: white;
                border: none;
                padding: 15px 25px;
                border-radius: 25px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 15px;
                width: 100%;
                box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
            `;
            subscribeBtn.onclick = function() {
                window.open(`https://t.me/${CHANNEL_USERNAME}`, '_blank');
                modal.remove();
            };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = 'Отмена';
            cancelBtn.style.cssText = `
                background: #f0f0f0;
                color: #666;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                font-size: 14px;
            `;
            cancelBtn.onclick = function() {
                modal.remove();
            };
            
            content.appendChild(closeBtn);
            content.appendChild(icon);
            content.appendChild(title);
            content.appendChild(message);
            content.appendChild(subscribeBtn);
            content.appendChild(cancelBtn);
            modal.appendChild(content);
            
            document.body.appendChild(modal);
            
            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        }

        // Массив с данными о видеоуроках по парковке
        const videos = [
            {

        function openVideo(videoNumber) {
            console.log('Открываем видео номер:', videoNumber);
            
            // Простая проверка
            if (videoNumber === undefined || videoNumber === null || videoNumber < 0 || videoNumber >= videos.length) {
                alert('Неверный номер видео!');
                return;
            }
            
            // Проверяем доступ к видео
            if (videoNumber >= FREE_VIDEOS_COUNT && !hasPaidSubscription) {
                showPaymentModal();
                return;
            }
            
            const video = videos[videoNumber];
            
            if (!video) {
                console.error('Видео не найдено для номера:', videoNumber);
                alert('Видео не найдено!');
                return;
            }
            
            console.log('Видео найдено:', video.title);
            
            // Проверяем, является ли видео приватным
            if (video.isPrivate) {
                // Для приватных видео показываем сообщение с прямой ссылкой
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.9);
                    z-index: 1000;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    padding: 20px;
                `;
                
                const content = document.createElement('div');
                content.style.cssText = `
                    background: white;
                    border-radius: 15px;
                    padding: 30px;
                    max-width: 500px;
                    width: 100%;
                    text-align: center;
                    position: relative;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                `;
                
                const closeBtn = document.createElement('button');
                closeBtn.innerHTML = '×';
                closeBtn.style.cssText = `
                    position: absolute;
                    top: 15px;
                    right: 20px;
                    background: #ff6b6b;
                    color: white;
                    border: none;
                    border-radius: 50%;
                    width: 30px;
                    height: 30px;
                    cursor: pointer;
                    font-size: 18px;
                    font-weight: bold;
                `;
                closeBtn.onclick = function() {
                    modal.remove();
                };
                
                const icon = document.createElement('div');
                icon.innerHTML = '🔒';
                icon.style.cssText = 'font-size: 48px; margin-bottom: 20px;';
                
                const title = document.createElement('h2');
                title.textContent = video.title;
                title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
                
                const message = document.createElement('p');
                message.innerHTML = `
                    Это приватное видео. Для просмотра перейдите по прямой ссылке:<br><br>
                    <a href="${video.directUrl || video.embedUrl}" target="_blank" style="color: #ff8c00; text-decoration: underline; word-break: break-all;">
                        ${video.directUrl || video.embedUrl}
                    </a>
                `;
                message.style.cssText = 'color: #666; margin-bottom: 25px; line-height: 1.5;';
                
                const openBtn = document.createElement('button');
                openBtn.innerHTML = '🚗 Открыть видео';
                openBtn.style.cssText = `
                    background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
                    color: white;
                    border: none;
                    padding: 15px 25px;
                    border-radius: 25px;
                    cursor: pointer;
                    font-size: 16px;
                    font-weight: 600;
                    margin-bottom: 15px;
                    width: 100%;
                    box-shadow: 0 3px 10px rgba(255, 140, 0, 0.3);
                `;
                openBtn.onclick = function() {
                    window.open(video.directUrl || video.embedUrl, '_blank');
                };
                
                const cancelBtn = document.createElement('button');
                cancelBtn.innerHTML = 'Закрыть';
                cancelBtn.style.cssText = `
                    background: #f0f0f0;
                    color: #666;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 20px;
                    cursor: pointer;
                    font-size: 14px;
                `;
                cancelBtn.onclick = function() {
                    modal.remove();
                };
                
                content.appendChild(closeBtn);
                content.appendChild(icon);
                content.appendChild(title);
                content.appendChild(message);
                content.appendChild(openBtn);
                content.appendChild(cancelBtn);
                modal.appendChild(content);
                
                document.body.appendChild(modal);
                
                // Закрытие по клику на фон
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.remove();
                    }
                });
                
                return;
            }
            
            // Используем RuTube embed URL для публичных видео
            const embedUrl = video.embedUrl;

            // Создаем простое модальное окно

            modal.style.cssText = `

                top: 0;
                left: 0;

                align-items: center;
                padding: 20px;
            `;

            content.style.cssText = `
                background: white;

            `;
            closeBtn.onclick = function() {
                modal.remove();
            };
            
            const title = document.createElement('h2');
            title.textContent = video.title;
            title.style.cssText = 'color: #333; margin-bottom: 15px; font-family: Arial, sans-serif;';
            
            const description = document.createElement('p');
            description.textContent = video.description;
            description.style.cssText = 'color: #666; margin-bottom: 15px; font-size: 14px;';
            
            const iframe = document.createElement('iframe');
            iframe.src = embedUrl;
            iframe.width = '100%';
            iframe.height = '400';
            iframe.frameBorder = '0';
            iframe.allowFullscreen = true;
            iframe.style.cssText = 'border-radius: 8px; margin-bottom: 15px;';
            
            // Обработка ошибок загрузки iframe
            iframe.onerror = function() {
                const errorDiv = document.createElement('div');
                errorDiv.style.cssText = `
                    background: #ffebee;
                    color: #c62828;
                    padding: 20px;
                    border-radius: 8px;
                    text-align: center;
                    margin-bottom: 15px;
                    border: 1px solid #ffcdd2;
                `;
                errorDiv.innerHTML = `
                    <strong>❌ Ошибка загрузки видео</strong><br>
                    Видео не удалось загрузить. Возможно, оно недоступно или заблокировано.<br><br>
                    <a href="${video.directUrl || embedUrl}" target="_blank" style="color: #ff8c00; text-decoration: underline;">
                        Попробовать открыть напрямую
                    </a>
                `;
                iframe.parentNode.replaceChild(errorDiv, iframe);
            };
            
            content.appendChild(closeBtn);
            content.appendChild(title);
            content.appendChild(description);
            content.appendChild(iframe);
            modal.appendChild(content);
            
            // Добавляем модальное окно в DOM
            console.log('Добавляем модальное окно в DOM...');
            document.body.appendChild(modal);
            console.log('Модальное окно добавлено в DOM');
            
            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
            
            // Закрытие по Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.remove();
                }
            });
        }
